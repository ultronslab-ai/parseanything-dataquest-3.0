services:
  - type: web
    name: parseanything-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAX_COST_TARGET_PER_1K
        value: "10.00"
